<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04282e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 5v8.5C28 23 22.6 28.4 16 30 9.4 28.4 4 23 4 15.5V7z' fill='%23c8f53c' stroke='%2304282e' stroke-width='1.5'/%3E%3Cpath d='M11 11h10l-2 3h-5l-1 2h5l-3 6h-3l2-4h-4z' fill='%2304282e'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/anton-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css?v=4">
<link rel="stylesheet" href="/css/site.css?v=6">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<title>Design Lab | SquadForge</title>
<meta name="description" content="Design your kit in live 3D: colors, patterns, lettering, numbers, patches and lighting. Then order one or the whole team.">
<link rel="stylesheet" href="/css/design.css?v=6">
</head>
<body data-page="design">
<div id="site-header"></div>
<main class="lab" id="lab">
  <section class="lab-stage" id="stage">
    <div class="lab-top">
      <div class="crumbs"><a href="/shop.html">Shop</a> / <span id="crumb">Design Lab</span></div>
      <div class="lab-tools">
        <button type="button" class="fx" id="fx" aria-pressed="true" title="4D motion on or off (M)"><i></i>4D</button>
        <div class="seg" id="views" role="group" aria-label="View"><button type="button" data-v="front" class="on">Front</button><button type="button" data-v="side">Side</button><button type="button" data-v="back">Back</button></div>
      </div>
    </div>
    <div class="v3d" id="viewer" aria-label="3D preview. Drag to spin, scroll or pinch to zoom."></div>
    <div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div>
    <div class="hint" id="hint">&#8596; Drag to spin</div>
    <div class="lights" id="lights" role="group" aria-label="Lighting">
      <button type="button" data-l="studio" class="on" title="Studio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button type="button" data-l="stadium" title="Stadium"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 20V9l7-4 7 4v11"/><path d="M9 20v-5h6v5"/></svg></button><button type="button" data-l="sunset" title="Sunset"><svg viewBox="0 0 24 24"><path d="M3 18h18M7 18a5 5 0 0110 0M12 4v4M5 9l2 2M19 9l-2 2"/></svg></button><button type="button" data-l="neon" title="Neon"><svg viewBox="0 0 24 24"><path d="M12 3l2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></button>
    </div>
    <div class="lab-bottom">
      <button type="button" class="round hot" id="remix" title="Random colorway (R)"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8" cy="8" r="1.2"/><circle cx="16" cy="16" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg>Remix</button>
      <button type="button" class="round" id="undo" title="Undo (Ctrl Z)" disabled>&#8630; Undo</button>
      <button type="button" class="round" id="reset">Reset</button>
      <button type="button" class="round" id="shot" title="Save a picture"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo</button>
      <button type="button" class="round" id="share"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M7 8l5-5 5 5"/></svg>Share</button>
    </div>
  </section>
  <section class="panel">
    <div class="meta" id="meta"></div>
    <h1 id="title">Design Lab</h1>
    <div class="price-row"><b id="unit"></b><s id="was"></s><span class="countdown" id="cd"></span></div>
    <p class="ship" id="ship"></p>
    <div class="steps" id="tabs" role="tablist"></div>
    <div id="panes"></div>
    <div class="team-box" id="team-box"></div>
    <div class="buybar">
      <div class="tot"><b id="total">$0.00</b><span id="total-note">each</span></div>
      <div class="qty" id="qty-box"><button type="button" id="qm" aria-label="Less">&minus;</button><input id="qty" value="1" inputmode="numeric" aria-label="Quantity"><button type="button" id="qp" aria-label="More">+</button></div>
      <button class="btn btn-lime" id="add">Add to bag</button>
    </div>
    <p class="desc" id="desc"></p>
  </section>
</main>
<section class="wrap" id="more-wrap"><h2 style="margin-top:40px">You might also like</h2><div class="grid" id="more"></div></section>
<div id="site-footer"></div>
<script type="module" src="/js/design.js?v=6"></script>
</body>
</html>
