<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04282e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 5v8.5C28 23 22.6 28.4 16 30 9.4 28.4 4 23 4 15.5V7z' fill='%23c8f53c' stroke='%2304282e' stroke-width='1.5'/%3E%3Cpath d='M11 11h10l-2 3h-5l-1 2h5l-3 6h-3l2-4h-4z' fill='%2304282e'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/anton-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css?v=4">
<link rel="stylesheet" href="/css/site.css?v=6">
<script type="importmap">{"imports":{"three":"/vendor/three/three.module.js","three/addons/":"/vendor/three/addons/"}}</script>
<title>Shop all gear | SquadForge</title>
<meta name="description" content="Custom jerseys, footwear, socks, shorts, caps, balls and bags. Every piece made to order in your colors.">
</head>
<body data-page="shop">
<div id="site-header"></div>
<main class="wrap">
  <div class="page-head"><h1 id="shop-title">Shop all</h1><p id="shop-sub">Every design can be customized in the 3D Design Lab.</p></div>
  <div class="chips" id="cats" role="group" aria-label="Category"></div>
  <div class="chips" id="sports" role="group" aria-label="Sport"></div>
  <div class="toolbar">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="input" id="q" type="search" placeholder="Search jerseys, cleats, socks..." aria-label="Search"></label>
    <select class="input" id="league" aria-label="League"><option value="">All leagues</option></select>
    <select class="input" id="sort" aria-label="Sort">
      <option value="hot">Trending</option><option value="new">Newest</option><option value="liked">Most loved</option>
      <option value="low">Price: low to high</option><option value="high">Price: high to low</option>
    </select>
    <button class="btn btn-line" id="surprise" type="button" title="Open a random design">Surprise me</button>
  </div>
  <p id="count" style="color:var(--mute);font-size:13px;margin:-8px 0 14px"></p>
  <div class="grid" id="results"></div>
  <div class="more"><button class="btn btn-ink" id="more" hidden>Show more</button></div>
</main>
<div id="site-footer"></div>
<script type="module" src="/js/shop.js?v=6"></script>
</body>
</html>
